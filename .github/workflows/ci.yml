name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  redteam:
    name: Security Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run input-screening and agent-scenario evaluation
        run: pnpm eval
        env:
          SPEAR_EVAL_RUN_ID: ${{ github.run_id }}:${{ github.run_attempt }}

      - name: Verify complete report and screening thresholds
        if: always()
        run: pnpm --filter @spear-secure/core eval:verify
        env:
          SPEAR_EVAL_RUN_ID: ${{ github.run_id }}:${{ github.run_attempt }}

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spear-eval-report
          path: packages/core/eval/report.json
          retention-days: 30
          if-no-files-found: error
