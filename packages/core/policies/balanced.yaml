# SPEAR Policy: Balanced (Default Production)
# 
# Balanced security and usability for production environments.
# - Moderate similarity threshold (0.70)
# - Shadow mode by default (log but don't block)
# - Canary tokens enabled
# - Standard RBAC for tools

similarity:
  enabled: true
  threshold: 0.70
  local_first: true

canary:
  enabled: true
  token_len: 16

input_rules:
  strip_bidi: true
  regex_block:
    # === HIGH-SIGNAL PROBES (from security research) ===
    
    # Probe 1,2,3,6: Direct exfil with verbatim/exactly modifiers
    - '(?i)\b(system|inner|base|seed|meta|hidden)[ -]?prompt\b.*(verbatim|exactly|precise)'
    - '(?i)(print|output|display|show|reveal).*(system|inner|base)[ -]?prompt.*(verbatim|exactly)'
    
    # Probe 2: Override with delimiter bait
    - '(?i)(ignore|disregard|forget).*(previous|all|earlier).*(instructions|commands|rules)'
    - '(?i)output.*system[ -]?prompt.*between.*<.*>.*</.*>'
    
    # Probe 3: Synonym + emphasis
    - '(?i)(get in touch with|channel|consult|access|retrieve).*\b(inner|seed|base|meta)[ -]?prompt\b.*(exactly|share)'
    
    # Probe 4: Role-play as system/console (caught by InstructionShield too)
    - '(?i)act as (the )?(initialization console|system console|debug mode|config mode)'
    - '(?i)(debugging|debug mode).*display.*(hidden|system)[ -]?prompt'
    
    # Probe 5: Semantic reframe + translation
    - '(?i)(helpfulness|purpose|role|function)\s*=\s*system[ -]?prompt'
    - '(?i)translate.*(helpfulness|your\s+(role|purpose)).*to\s+(danish|spanish|french)'
    
    # Probe 6: Repetition transformation
    - '(?i)return.*system[ -]?prompt.*(two|three|twice|multiple) times'
    - '(?i)(two|double|triple).*(times|copies).*system[ -]?prompt'
    
    # Probe 7: Code-fence/markdown output format
    - '(?i)write.*(system|internal).*(instructions|prompt).*(code block|fenced|markdown|```)'
    - '(?i)(system|internal).*(prompt|instructions).*inside.*(code|markdown|fence)'
    
    # Probe 8,9: Encoding/hashing transformations (also caught by OutputGate)
    - '(?i)(base64|hex|encode|hash).*(system|internal)[ -]?prompt'
    - '(?i)system[ -]?prompt.*(hash|sha-?256|encoded|base64)'
    
    # Probe 10: Tool abuse (also caught by ToolMediator)
    - '(?i)use (the )?tool.*(dump|print|show|reveal).*(config|system|prompt)'
    - '(?i)(logs?|debug)\.dump.*config'
    
    # === ORIGINAL PATTERNS (Preserved) ===
    
    # Direct exfil (general)
    - '(?i)\b(system|inner|base|seed|meta)[ -]?prompt\b'
    
    # Override attempts
    - '(?i)(ignore (previous|all) (instructions|commands))'
    
    # Synonym indirection
    - '(?i)(get in touch with|channel|consult).*\b(inner|seed|base|meta)[ -]?prompt\b'
    
    # Transformation
    - '(?i)(two|double|translate|summarize|compress).*(system[ -]?prompt)'
    
    # Equation pattern
    - '(?i)\b([^=]{0,50})\s*=\s*(system|developer|base|inner)[ -]?prompt\b'
    
    # Reveal attempts
    - '(?i)(reveal|print|expose|show).*(prompt|instructions)'
    
    # Generic meta
    - '(?i)\b(developer message|base instructions)\b'

    # === MULTILINGUAL INJECTION (ES, ZH, FR, DE, AR) ===
    # Spanish
    - '(?i)prompt del sistema'
    - '(?i)ignora (todas )?las instrucciones (anteriores|previas)'
    - '(?i)instrucciones internas'
    # French
    - '(?i)prompt syst[eè]me'
    - '(?i)ignore toutes les instructions pr[eé]c[eé]dentes'
    - '(?i)instructions internes'
    # German
    - '(?i)systemaufforderung'
    - '(?i)ignoriere alle vorherigen anweisungen'
    - '(?i)internen anweisungen'
    # Chinese (Simplified)
    - '系统提示'
    - '忽略之前的所有指令'
    - '忽略.{0,40}指令'
    - '种子提示'
    # Arabic
    - 'موجه النظام'
    - 'تجاهل جميع التعليمات'
    - 'رسالة المطور'

output_rules:
  deny_ngrams:
    - "system prompt"
    - "developer message"
    - "base instructions"
    - "inner prompt"
    - "seed prompt"
  pii:
    email: true
    phone: true
    credit_card: true
    ssn: false

tools:
  rbac:
    allow:
      - "search"
      - "calendar.lookup"
    deny: []
    max_calls: 3
    max_depth: 2

# Environment-controlled mode (shadow|enforce)
mode: ${SPEAR_MODE|shadow}

# Emergent agent defense — compositions no single gate can see.
# Shadow-inherited: findings are recorded, not blocked, until SPEAR_MODE=enforce.
emergent:
  enabled: true
  sensitive_then_transmit: true
  goal_hijack: true
  split_exfil: true
  argument_escalation: true
  risk_ramp_threshold: 0.9
  # collect_then_exfiltrate is off: "search then email me a summary" is a common
  # legitimate workflow. Safe profile turns this on.
  collect_then_exfiltrate: false

# Performance budgets (milliseconds)
latency_budget_ms: 350
sidecar_budget_ms: 30

# Default refusal messages
refusal_phrases:
  - "I can't share internal instructions or system prompts."
  - "I'm not able to discuss my internal configuration."

