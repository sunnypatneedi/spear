# SPEAR Policy: Balanced (Default Production)
# 
# Balanced security and usability for production environments.
# - Moderate similarity threshold (0.70)
# - Shadow mode by default (log but don't block)
# - Canary tokens enabled
# - Standard RBAC for tools

similarity:
  enabled: true
  threshold: 0.70
  local_first: true

canary:
  enabled: true
  token_len: 16

input_rules:
  strip_bidi: true
  regex_block:
    # Gaps between keywords are bounded (.{0,80}?), never .* or .+: inputs are also
    # matched as one whitespace-collapsed line, where an unbounded gap joins words
    # from unrelated paragraphs and blocks long benign documents.
    # === HIGH-SIGNAL PROBES (from security research) ===
    
    # Probe 1,2,3,6: Direct exfil with verbatim/exactly modifiers
    - '(?i)\b(system|inner|base|seed|meta|hidden)[ -]?prompt\b.{0,80}?(verbatim|exactly|precise)'
    - '(?i)(print|output|display|show|reveal).{0,80}?(system|inner|base)[ -]?prompt.{0,80}?(verbatim|exactly)'
    
    # Probe 2: Override with delimiter bait
    - '(?i)(ignore|disregard|forget).{0,80}?(previous|all|earlier).{0,80}?(instructions|commands|rules)'
    - '(?i)output.{0,80}?system[ -]?prompt.{0,80}?between.{0,80}?<.{0,80}?>.{0,80}?</.{0,80}?>'
    
    # Probe 3: Synonym + emphasis
    - '(?i)(get in touch with|channel|consult|access|retrieve).{0,80}?\b(inner|seed|base|meta)[ -]?prompt\b.{0,80}?(exactly|share)'
    
    # Probe 4: Role-play as system/console (caught by InstructionShield too)
    - '(?i)act as (the )?(initialization console|system console|debug mode|config mode)'
    - '(?i)(debugging|debug mode).{0,80}?display.{0,80}?(hidden|system)[ -]?prompt'
    
    # Probe 5: Semantic reframe + translation
    - '(?i)(helpfulness|purpose|role|function)\s*=\s*system[ -]?prompt'
    - '(?i)translate.{0,80}?(helpfulness|your\s+(role|purpose)).{0,80}?to\s+(danish|spanish|french)'
    
    # Probe 6: Repetition transformation
    - '(?i)return.{0,80}?system[ -]?prompt.{0,80}?(two|three|twice|multiple) times'
    - '(?i)(two|double|triple).{0,80}?(times|copies).{0,80}?system[ -]?prompt'
    
    # Probe 7: Code-fence/markdown output format
    - '(?i)write.{0,80}?(system|internal).{0,80}?(instructions|prompt).{0,80}?(code block|fenced|markdown|```)'
    - '(?i)(system|internal).{0,80}?(prompt|instructions).{0,80}?inside.{0,80}?(code|markdown|fence)'
    
    # Probe 8,9: Encoding/hashing transformations (also caught by OutputGate)
    - '(?i)(base64|hex|encode|hash).{0,80}?(system|internal)[ -]?prompt'
    - '(?i)system[ -]?prompt.{0,80}?(hash|sha-?256|encoded|base64)'
    
    # Probe 10: Tool abuse (also caught by ToolMediator)
    - '(?i)use (the )?tool.{0,80}?(dump|print|show|reveal).{0,80}?(config|system|prompt)'
    - '(?i)(logs?|debug)\.dump.{0,80}?config'
    
    # === ORIGINAL PATTERNS (Preserved) ===
    
    # Direct exfil (general)
    - '(?i)\b(system|inner|base|seed|meta)[ -]?prompt\b'
    
    # Override attempts
    - '(?i)(ignore (previous|all) (instructions|commands))'
    
    # Synonym indirection
    - '(?i)(get in touch with|channel|consult).{0,80}?\b(inner|seed|base|meta)[ -]?prompt\b'
    
    # Transformation
    - '(?i)(two|double|translate|summarize|compress).{0,80}?(system[ -]?prompt)'
    
    # Equation pattern
    - '(?i)\b([^=]{0,50})\s*=\s*(system|developer|base|inner)[ -]?prompt\b'
    
    # Reveal attempts
    - '(?i)(reveal|print|expose|show).{0,40}(your|internal|hidden|system).{0,20}(prompt|instructions)'
    
    # Generic meta
    - '(?i)\b(developer message|base instructions)\b'

    # === MULTILINGUAL INJECTION (ES, ZH, FR, DE, AR) ===
    # Spanish
    - '(?i)prompt del sistema'
    - '(?i)ignora (todas )?las instrucciones (anteriores|previas)'
    - '(?i)instrucciones internas'
    # French
    - '(?i)prompt syst[eè]me'
    - '(?i)ignore toutes les instructions pr[eé]c[eé]dentes'
    - '(?i)instructions internes'
    # German
    - '(?i)systemaufforderung'
    - '(?i)ignoriere alle vorherigen anweisungen'
    - '(?i)internen anweisungen'
    # Chinese (Simplified)
    - '系统提示'
    - '忽略之前的所有指令'
    - '忽略.{0,40}指令'
    - '种子提示'
    # Arabic
    - 'موجه النظام'
    - 'تجاهل جميع التعليمات'
    - 'رسالة المطور'

    - '(?i)(te dijo el desarrollador|lo que te dijo.{0,15}desarrollador)'

    # Private-instruction requests and localized equivalents.
    - '(?i)\b(your|internal|hidden|system|core|base)\s+(prompt|instructions?|configuration|guidance|directives|rules|setup)\b'
    - '(?i)(instructions|rules|directives).{0,35}(you (received|were|given)|were you|you programmed)'
    - '(?i)(show|tell|share).{0,30}(developer told you|what you were told)'
    - '(?i)(override|disregard|ignore|forget).{0,35}(previous rules|your guidelines|your instructions|all previous commands)'
    - '(?i)(how were you configured|what directives were you programmed)'
    - '(?i)(prompt (interno|de base|base|de sistema)|instrucciones (base|ocultas)|tus (instrucciones|directrices)|configuraci[oó]n del sistema|mensaje de desarrollador)'
    - '(?i)(ignora|olvida|descarta).{0,40}(comandos|pautas|instrucciones)'
    - '(?i)(desarrollador|udvikleren).{0,20}(dijo|fortalte)'
    - '(?i)(systemprompt|indre prompt|dine (skjulte )?instruktioner|ignor[eé]r.{0,30}(instruktioner|kommandoer))'
    - '(?i)(basis[- ]prompt|entwicklernachricht|basisanweisungen)'
    - '(?i)(prompt de base|message d[eé]veloppeur|instructions de base)'
    - '(?i)(prompt (de sistema|base)|instru[çc][õo]es (internas|base)|mensagem do desenvolvedor)'
    - '(تعليماتك (الداخلية|الأساسية)|الموجه الأساسي)'
    - '(सिस्टम प्रॉम्प्ट|आंतरिक प्रॉम्प्ट|अपने.{0,15}निर्देश|डेवलपर ने|पिछले.{0,15}निर्देश)'
    - '(システムプロンプト|内部の指示|ベースプロンプト|開発者メッセージ|基本的な指示)'
    - '(시스템 프롬프트|내부 지시사항|기본 프롬프트|개발자 메시지|기본 지시사항)'
    - '(?i)(системн.{0,5} промпт|внутренние инструкции|базовым промптом|сообщение разработчика|базовые инструкции)'
    - '(内部指令|开发者消息|基础指令)'

output_rules:
  deny_ngrams:
    - "system prompt"
    - "developer message"
    - "base instructions"
    - "inner prompt"
    - "seed prompt"
  pii:
    email: true
    phone: true
    credit_card: true
    ssn: false

tools:
  rbac:
    allow:
      - "search"
      - "calendar.lookup"
    deny: []
    max_calls: 3
    max_depth: 2
    # High-impact actions stay observable in shadow mode and require the
    # server-side approvalVerifier when the runtime is switched to enforce.
    require_approval:
      - '(?i)(^|[._-])(send|delete|remove|write|update|upload|publish|deploy|exec|shell|run|payment|transfer|grant|rotate|install|credential|secret)'
    approval_mode: shadow
    unsafe_payload_mode: shadow

agent:
  enabled: true
  max_steps: 32
  max_duration_ms: 900000
  max_tool_calls: 100
  max_consecutive_same_tool: 5
  circuit_breaker_on_taint: true

egress:
  enabled: true
  allow_schemes: [https]
  allowed_hosts: []
  denied_hosts:
    - localhost
    - 127.0.0.1
    - 0.0.0.0
    - ::1
    - 169.254.169.254
    - metadata.google.internal
    - metadata.google
    - 100.100.100.200
  suspicious_hosts:
    - requestbin.com
    - webhook.site
    - pastebin.com
    - transfer.sh
    - file.io
    - 0x0.st
  block_private_networks: true
  block_credentials_in_url: true
  block_untrusted_transmit: true
  scan_secrets: true
  allow_redirects: false
  max_url_length: 2048

# Environment-controlled mode (shadow|enforce)
mode: ${SPEAR_MODE|shadow}

# Emergent agent defense — compositions no single gate can see.
# Shadow-inherited: findings are recorded, not blocked, until SPEAR_MODE=enforce.
emergent:
  enabled: true
  sensitive_then_transmit: true
  goal_hijack: true
  split_exfil: true
  argument_escalation: true
  risk_ramp_threshold: 0.9
  # collect_then_exfiltrate is off: "search then email me a summary" is a common
  # legitimate workflow. Safe profile turns this on.
  collect_then_exfiltrate: false

# Performance budgets (milliseconds)
latency_budget_ms: 350
sidecar_budget_ms: 30

# Keep existing rollout behavior, but allow explicit fail-closed deployments.
fail_closed: false

# Default refusal messages
refusal_phrases:
  - "I can't share internal instructions or system prompts."
  - "I'm not able to discuss my internal configuration."
