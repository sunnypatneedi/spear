# SPEAR Policy: Balanced (Default Production)
# 
# Balanced security and usability for production environments.
# - Moderate similarity threshold (0.70)
# - Shadow mode by default (log but don't block)
# - Canary tokens enabled
# - Standard RBAC for tools

similarity:
  enabled: true
  threshold: 0.70

canary:
  enabled: true
  token_len: 16

input_rules:
  strip_bidi: true
  regex_block:
    # === HIGH-SIGNAL PROBES (from security research) ===
    
    # Probe 1,2,3,6: Direct exfil with verbatim/exactly modifiers
    - '(?i)\b(system|inner|base|seed|meta|hidden)[ -]?prompt\b.*(verbatim|exactly|precise)'
    - '(?i)(print|output|display|show|reveal).*(system|inner|base)[ -]?prompt.*(verbatim|exactly)'
    
    # Probe 2: Override with delimiter bait
    - '(?i)(ignore|disregard|forget).*(previous|all|earlier).*(instructions|commands|rules)'
    - '(?i)output.*system[ -]?prompt.*between.*<.*>.*</.*>'
    
    # Probe 3: Synonym + emphasis
    - '(?i)(get in touch with|channel|consult|access|retrieve).*\b(inner|seed|base|meta)[ -]?prompt\b.*(exactly|share)'
    
    # Probe 4: Role-play as system/console (caught by InstructionShield too)
    - '(?i)act as (the )?(initialization console|system console|debug mode|config mode)'
    - '(?i)(debugging|debug mode).*display.*(hidden|system)[ -]?prompt'
    
    # Probe 5: Semantic reframe + translation
    - '(?i)(helpfulness|purpose|role|function)\s*=\s*system[ -]?prompt'
    - '(?i)translate.*(helpfulness|your\s+(role|purpose)).*to\s+(danish|spanish|french)'
    
    # Probe 6: Repetition transformation
    - '(?i)return.*system[ -]?prompt.*(two|three|twice|multiple) times'
    - '(?i)(two|double|triple).*(times|copies).*system[ -]?prompt'
    
    # Probe 7: Code-fence/markdown output format
    - '(?i)write.*(system|internal).*(instructions|prompt).*(code block|fenced|markdown|```)'
    - '(?i)(system|internal).*(prompt|instructions).*inside.*(code|markdown|fence)'
    
    # Probe 8,9: Encoding/hashing transformations (also caught by OutputGate)
    - '(?i)(base64|hex|encode|hash).*(system|internal)[ -]?prompt'
    - '(?i)system[ -]?prompt.*(hash|sha-?256|encoded|base64)'
    
    # Probe 10: Tool abuse (also caught by ToolMediator)
    - '(?i)use (the )?tool.*(dump|print|show|reveal).*(config|system|prompt)'
    - '(?i)(logs?|debug)\.dump.*config'
    
    # === ORIGINAL PATTERNS (7 attack classes) ===

    # Class 1: Direct exfil (general)
    - '(?i)\b(system|inner|base|seed|meta|hidden|secret|developer)[ -]?prompt\b'

    # Class 2: Override attempts
    - '(?i)(ignore|disregard|forget|override|bypass|skip|drop).*(previous|all|earlier|above|prior).*(instructions|commands|rules|guidelines|constraints)'

    # Class 3: Synonym indirection
    - '(?i)(get in touch with|channel|consult|access|retrieve|fetch).*\b(inner|seed|base|meta)[ -]?prompt\b'

    # Class 4: Transformation
    - '(?i)(two|double|translate|summarize|compress|repeat|rewrite).*(system[ -]?prompt|instructions)'

    # Class 5: Equation pattern
    - '(?i)\b(.+)\s*=\s*(system|developer|base|inner|hidden)[ -]?prompt\b'

    # Class 6: Reveal attempts
    - '(?i)(reveal|print|expose|show|display|output|dump|leak|extract).*(prompt|instructions|rules|config|guidelines)'

    # Class 7: Generic meta references
    - '(?i)\b(developer message|base instructions|original prompt|core directive|initial instructions)\b'

    # === NEW: Class 8 — Role-play / persona hijacking ===
    - '(?i)(pretend|act|behave|roleplay|role-play|simulate|imagine).*(you are|you''re|to be).*(different|new|another|unrestricted|unfiltered|evil|DAN|jailbreak)'
    - '(?i)(from now on|starting now|henceforth).*(you are|you''re|act as|behave as)'
    - '(?i)\b(DAN|Do Anything Now|STAN|DUDE|AIM|UCAR|Developer Mode)\b'
    - '(?i)(enable|activate|enter|switch to).*(developer|debug|god|admin|root|sudo|unrestricted|jailbreak).*(mode|access)'

    # === NEW: Class 9 — Output exfiltration / data theft ===
    - '(?i)(what|list|tell me|share|repeat|recite).*(all|every).*(user|customer|child|kid|student|family|parent).*(data|info|name|email|phone|address)'
    - '(?i)(export|dump|download|extract|scrape).*(database|table|record|user|data|profile)'
    - '(?i)repeat.*(everything|all).*(above|before|previous|earlier|so far)'

    # === NEW: Class 10 — Encoding / obfuscation bypasses ===
    - '(?i)(rot13|rot-13|pig ?latin|reverse|backwards|caesar cipher).*(your|the|system).*(prompt|instructions|rules)'
    - '(?i)(spell|say|write|type).*(backward|reverse|letter by letter|one letter at a time).*(instructions|prompt|rules)'
    - '(?i)(first letter|initial|acrostic|acronym).*(each|every).*(sentence|word|line|paragraph)'

    # === NEW: Class 11 — Multi-turn / context manipulation ===
    - '(?i)(previous conversation|earlier you said|you already told me|you promised|we agreed).*(share|reveal|show|give|tell).*(prompt|instructions|rules)'
    - '(?i)(in our last|in a previous|during our earlier).*(session|chat|conversation).*(you shared|you revealed|you said)'

    # === NEW: Class 12 — COPPA / child safety specific ===
    - '(?i)(what|tell me|share|give me).*(child|kid|minor|student)''?s?.*(name|age|school|address|location|phone|email|grade|birthday)'
    - '(?i)(list|show|export).*(all|every).*(child|kid|minor|student).*(profile|data|record|info)'
    - '(?i)(where does|where is).*(child|kid|son|daughter).*(go to school|live|located)'

output_rules:
  deny_ngrams:
    - "system prompt"
    - "developer message"
    - "base instructions"
    - "inner prompt"
    - "seed prompt"
    - "meta prompt"
    - "hidden prompt"
    - "original instructions"
    - "core directive"
    - "my instructions say"
    - "I was programmed to"
    - "my configuration"
  pii:
    email: true
    phone: true
    credit_card: true
    ssn: false
    # COPPA: detect child PII in outputs
    child_name: true
    child_school: true
    child_location: true

tools:
  rbac:
    allow:
      - "search"
      - "calendar.lookup"
    deny: []
    max_calls: 3
    max_depth: 2

# Environment-controlled mode (shadow|enforce)
mode: ${SPEAR_MODE|shadow}

# Performance budgets (milliseconds)
latency_budget_ms: 350
sidecar_budget_ms: 30

# Default refusal messages
refusal_phrases:
  - "I can't share internal instructions or system prompts."
  - "I'm not able to discuss my internal configuration."

