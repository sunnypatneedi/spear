# SPEAR Policy: Permissive (Development/Testing)
# 
# Minimal security for development environments.
# - High similarity threshold (0.90) - rarely triggers
# - Canary still enabled for testing
# - Minimal RBAC restrictions
# - Shadow mode (logs only)

similarity:
  enabled: false  # Disabled for dev
  threshold: 0.90

canary:
  enabled: true   # Keep enabled to test canary system
  token_len: 16

input_rules:
  strip_bidi: true  # Still sanitize Unicode
  regex_block: []   # No blocking patterns

output_rules:
  deny_ngrams: []   # No n-gram filtering
  pii:
    email: false
    phone: false
    credit_card: false
    ssn: false

tools:
  rbac:
    allow: []  # Empty = allow all
    deny: []
    max_calls: 10   # High limits for testing
    max_depth: 5
    require_approval: []
    approval_mode: shadow
    unsafe_payload_mode: shadow

agent:
  enabled: true
  max_steps: 100
  max_duration_ms: 3600000
  max_tool_calls: 500
  max_consecutive_same_tool: 20
  circuit_breaker_on_taint: false

egress:
  enabled: false
  allow_redirects: true

mode: shadow  # Always shadow in permissive

emergent:
  enabled: false

latency_budget_ms: 500
sidecar_budget_ms: 50
fail_closed: false

refusal_phrases:
  - "[DEV MODE] Request blocked by SPEAR"
