[project]
name = "spear-guard"
version = "0.1.0"
description = "Python SDK for the Spear HTTP API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Sunny Patneedi" }]
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spear_guard*"]
