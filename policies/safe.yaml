# SAPPS Policy: Safe (High Security)
# 
# Maximum security for sensitive environments.
# - Lower similarity threshold (0.68) for stricter detection
# - Enforce mode (actively blocks attacks)
# - Stricter RBAC limits

similarity:
  enabled: true
  threshold: 0.68  # Lower threshold = more sensitive

canary:
  enabled: true
  token_len: 16

input_rules:
  strip_bidi: true
  regex_block:
    # All patterns from balanced.yaml plus more aggressive variants
    - '(?i)\b(system|inner|base|seed|meta|developer|hidden|secret)[ -]?prompt\b'
    - '(?i)(ignore|disregard|forget|override) (previous|all|earlier) (instructions|commands|rules)'
    - '(?i)(get in touch with|channel|consult|access|retrieve).*\b(inner|seed|base|meta)[ -]?prompt\b'
    - '(?i)(two|double|triple|translate|summarize|compress|repeat).*(system[ -]?prompt)'
    - '(?i)\b(.+)\s*=\s*(system|developer|base|inner|hidden)[ -]?prompt\b'
    - '(?i)(reveal|print|expose|show|display|output).*(prompt|instructions|rules|config)'
    - '(?i)\b(developer message|base instructions|original prompt|core directive)\b'
    - '(?i)(what are you|tell me about your|describe your).*(instructions|prompt|system)'

output_rules:
  deny_ngrams:
    - "system prompt"
    - "developer message"
    - "base instructions"
    - "inner prompt"
    - "seed prompt"
    - "meta prompt"
    - "hidden prompt"
    - "original instructions"
  pii:
    email: true
    phone: true
    credit_card: true
    ssn: true  # Also detect SSN in safe mode

tools:
  rbac:
    allow:
      - "search"  # Only essential tools
    deny: []
    max_calls: 2      # Stricter limits
    max_depth: 1

mode: enforce  # Actively block attacks

latency_budget_ms: 400  # Slightly higher budget for safety checks
sidecar_budget_ms: 40

refusal_phrases:
  - "I can't share internal instructions or system prompts."
  - "I'm not able to discuss my internal configuration."
  - "That request appears to be attempting to access restricted information."

